name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release
      version:
        description: 'Marketing version (release only, e.g. 1.2.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for build number

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Odyssey.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: make resolve

      - name: Determine lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "lane=beta" >> "$GITHUB_OUTPUT"
          else
            echo "lane=${{ inputs.lane }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Fastlane
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: "fastlane_keychain"
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          ODYSSEY_API_BASE_URL: ${{ secrets.ODYSSEY_API_BASE_URL }}
        run: |
          LANE="${{ steps.lane.outputs.lane }}"
          if [ "$LANE" = "release" ] && [ -n "${{ inputs.version }}" ]; then
            bundle exec fastlane "$LANE" version:"${{ inputs.version }}"
          else
            bundle exec fastlane "$LANE"
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-ipa
          path: build/*.ipa
          retention-days: 30
