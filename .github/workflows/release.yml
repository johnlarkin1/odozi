name: Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release
      tag:
        description: 'Git tag to build from (defaults to latest v* tag)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  determine-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            git ls-remote --tags --sort=-v:refname "https://github.com/${{ github.repository }}.git" 'refs/tags/v*' | head -n 1 | awk '{print $2}' | sed 's|refs/tags/||' > /tmp/latest_tag
            TAG=$(cat /tmp/latest_tag)
            if [ -z "$TAG" ]; then
              echo "::error::No v* tags found. Create a tag first."
              exit 1
            fi
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: determine-ref
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-ref.outputs.ref }}

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Odyssey.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Create xcconfig
        run: cp Odyssey.xcconfig.example Odyssey.xcconfig

      - name: Resolve packages
        run: make resolve

      - name: Set up iOS Simulator
        id: simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rts = [r for r in json.loads(sys.stdin.read())['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(rts[-1]['identifier'])
          ")
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          devs = data['devices'].get('$RUNTIME', [])
          matches = [d['udid'] for d in devs if d['name'] == 'iPhone 16' and d['isAvailable']]
          if matches:
              print(matches[0])
          " 2>/dev/null)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild -project Odyssey.xcodeproj -scheme Odyssey \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -enableCodeCoverage YES \
            test

  deploy:
    needs: [determine-ref, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Odyssey.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: make resolve

      - name: Run Fastlane
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: "fastlane_keychain"
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          ODYSSEY_API_BASE_URL: ${{ secrets.ODYSSEY_API_BASE_URL }}
        run: |
          LANE="${{ inputs.lane }}"
          TAG="${{ steps.tag.outputs.ref }}"
          if [ "$LANE" = "release" ]; then
            VERSION="${TAG#v}"
            bundle exec fastlane "$LANE" version:"$VERSION"
          else
            bundle exec fastlane "$LANE"
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-ipa
          path: build/*.ipa
          retention-days: 30
