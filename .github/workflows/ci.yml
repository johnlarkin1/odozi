name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Create xcconfig
        run: cp Odyssey.xcconfig.example Odyssey.xcconfig

      - name: Resolve packages
        run: make resolve

      - name: Build
        run: make build

      - name: Run tests
        run: make test
