name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    if: github.event_name == 'push'
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Odyssey.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Create xcconfig
        run: cp Odyssey.xcconfig.example Odyssey.xcconfig

      - name: Resolve packages
        run: make resolve

      - name: List available simulators
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -30

      - name: Build
        run: make build DESTINATION='generic/platform=iOS Simulator'

      - name: Set up iOS Simulator
        run: |
          # Create a simulator device if one doesn't already exist
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; rts=[r for r in json.loads(sys.stdin.read())['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]; print(rts[-1]['identifier'])" 2>/dev/null) || true
          if [ -n "$RUNTIME" ]; then
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME" 2>/dev/null || echo "iPhone 16 simulator already exists"
          else
            echo "No iOS runtime found, downloading..."
            xcodebuild -downloadPlatform iOS
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; rts=[r for r in json.loads(sys.stdin.read())['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]; print(rts[-1]['identifier'])")
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME" 2>/dev/null || echo "iPhone 16 simulator already exists"
          fi

      - name: Run tests
        run: |
          xcodebuild -project Odyssey.xcodeproj -scheme Odyssey \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
