name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    if: github.event_name == 'push'
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Odyssey.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Create xcconfig
        run: cp Odyssey.xcconfig.example Odyssey.xcconfig

      - name: Resolve packages
        run: make resolve

      - name: List available simulators
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -30

      - name: Build
        run: make build DESTINATION='generic/platform=iOS Simulator'

      - name: Set up iOS Simulator
        id: simulator
        run: |
          # Find the latest iOS runtime
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rts = [r for r in json.loads(sys.stdin.read())['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(rts[-1]['identifier'])
          ")
          echo "Using runtime: $RUNTIME"

          # Find an existing iPhone 16 simulator on that runtime, or create one
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          runtime = '$RUNTIME'
          devs = data['devices'].get(runtime, [])
          matches = [d['udid'] for d in devs if d['name'] == 'iPhone 16' and d['isAvailable']]
          if matches:
              print(matches[0])
          " 2>/dev/null)

          if [ -z "$UDID" ]; then
            echo "No iPhone 16 on $RUNTIME — creating one"
            UDID=$(xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi

          echo "Simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild -project Odyssey.xcodeproj -scheme Odyssey \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
