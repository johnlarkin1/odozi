# SwiftLint configuration for Odyssey iOS app

excluded:
  - DerivedData
  - build
  - .build
  - .worktrees
  - Packages
  - .swiftpm
  - Odyssey.xcodeproj

disabled_rules:
  - large_tuple
  - todo
  - trailing_whitespace
  - nesting
  - function_parameter_count

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 100
  error: 200

type_body_length:
  warning: 600
  error: 800

file_length:
  warning: 700
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - i
    - j
    - x
    - y
    - z
    - r
    - g
    - b
    - a
    - c
    - k
    - n
    - t
    - u
    - v
    - id
    - to

reporter: xcode
