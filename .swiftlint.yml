# SwiftLint configuration for Odyssey iOS app

excluded:
  - DerivedData
  - build
  - .build
  - Packages
  - .swiftpm
  - Odyssey.xcodeproj

disabled_rules:
  - large_tuple
  - todo
  - trailing_whitespace
  - nesting

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - toggle_bool

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 80
  error: 200

type_body_length:
  warning: 400
  error: 800

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - i
    - x
    - y
    - z
    - id
    - to

reporter: xcode
