<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D1F"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#8C5CF5"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#8C5CF5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8C5CF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Cosmic glow orbs -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Stars -->
  <circle cx="150" cy="120" r="1.5" fill="#EDF0FA" opacity="0.6"/>
  <circle cx="400" cy="80" r="1" fill="#EDF0FA" opacity="0.4"/>
  <circle cx="750" cy="150" r="1.5" fill="#EDF0FA" opacity="0.5"/>
  <circle cx="1050" cy="100" r="1" fill="#EDF0FA" opacity="0.3"/>
  <circle cx="200" cy="500" r="1" fill="#EDF0FA" opacity="0.4"/>
  <circle cx="900" cy="480" r="1.5" fill="#EDF0FA" opacity="0.5"/>
  <circle cx="600" cy="550" r="1" fill="#EDF0FA" opacity="0.3"/>

  <!-- Compass mark -->
  <circle cx="600" cy="200" r="40" stroke="url(#title)" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="600" cy="200" r="8" fill="url(#title)" opacity="0.6"/>
  <line x1="600" y1="160" x2="600" y2="175" stroke="url(#title)" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="225" x2="600" y2="240" stroke="url(#title)" stroke-width="2" opacity="0.6"/>
  <line x1="560" y1="200" x2="575" y2="200" stroke="url(#title)" stroke-width="2" opacity="0.6"/>
  <line x1="625" y1="200" x2="640" y2="200" stroke="url(#title)" stroke-width="2" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="bold" fill="url(#title)">Odyssey</text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#EDF0FA" opacity="0.8">Your daily journey inward.</text>

  <!-- Description -->
  <text x="600" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#EDF0FA" opacity="0.5">Guided journaling for iOS - capture your world, reveal patterns.</text>

  <!-- Subtle bottom border -->
  <rect x="400" y="520" width="400" height="2" rx="1" fill="url(#title)" opacity="0.3"/>
</svg>
