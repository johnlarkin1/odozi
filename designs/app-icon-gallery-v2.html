<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Navigator (Clean)</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #0d0d1f;
      }
      canvas {
        width: min(92vmin, 520px);
        height: min(92vmin, 520px);
        border-radius: 76px;
        box-shadow: 0 14px 60px rgba(0, 0, 0, 0.55);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1024" height="1024"></canvas>

    <script>
      const S = 1024;

      // Palette (matches your set)
      const AMBER = "#F5A623";
      const TEAL = "#2EC4B6";
      const PURPLE = "#8C5CF5";
      const PINK = "#E86BAD";
      const DEEP = "#0D0D1F";
      const WHITE = "#EDF0FA";

      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
      }
      function rgba(hex, a) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r},${g},${b},${a})`;
      }

      // Deterministic RNG for stars
      function rng(seed) {
        let s = seed >>> 0;
        return () => {
          // LCG
          s = (1664525 * s + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      // --- Shape helpers (same “style”, slightly cleaner curves) ---
      function pathMainSail(ctx, mx, top, bot, width) {
        ctx.beginPath();
        ctx.moveTo(mx + 6, top);
        ctx.quadraticCurveTo(
          mx + width * 0.78,
          top + (bot - top) * 0.33,
          mx + width,
          bot - 10,
        );
        ctx.lineTo(mx + 6, bot - 10);
        ctx.closePath();
      }
      function pathJibSail(ctx, mx, top, bot, width) {
        ctx.beginPath();
        ctx.moveTo(mx - 6, top + 22);
        ctx.quadraticCurveTo(
          mx - width * 0.72,
          top + (bot - top) * 0.44,
          mx - width,
          bot - 24,
        );
        ctx.lineTo(mx - 6, bot - 24);
        ctx.closePath();
      }
      function pathHull(ctx, cx, y, w, h) {
        // Slightly flatter top edge, rounder belly
        ctx.beginPath();
        ctx.moveTo(cx - w / 2, y);
        ctx.quadraticCurveTo(cx - w * 0.36, y + h * 1.02, cx, y + h * 0.84);
        ctx.quadraticCurveTo(cx + w * 0.36, y + h * 0.72, cx + w / 2, y);
        ctx.closePath();
      }

      // --- Water: a single “surface” path + layered fills (keeps it clean) ---
      function pathWaterSurface(ctx, yBase, seedPhase = 0) {
        // A gentle multi-sine waterline
        const A1 = 14,
          A2 = 7,
          A3 = 4;
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        for (let x = 0; x <= S; x += 6) {
          const t = x / S;
          const y =
            yBase +
            Math.sin(t * Math.PI * 2.1 + seedPhase) * A1 +
            Math.sin(t * Math.PI * 3.9 + seedPhase * 1.6) * A2 +
            Math.sin(t * Math.PI * 8.2 + seedPhase * 0.9) * A3;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(S, S);
        ctx.lineTo(0, S);
        ctx.closePath();
      }

      function drawCosmicClean(ctx) {
        ctx.clearRect(0, 0, S, S);

        // -------- Sky background
        const sky = ctx.createRadialGradient(
          S * 0.5,
          S * 0.38,
          0,
          S * 0.5,
          S * 0.44,
          S * 0.82,
        );
        sky.addColorStop(0, "#1a1040");
        sky.addColorStop(0.55, "#0e0a22");
        sky.addColorStop(1, "#060410");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, S, S);

        // Nebula glows (soft, not noisy)
        const neb1 = ctx.createRadialGradient(
          S * 0.38,
          S * 0.34,
          0,
          S * 0.38,
          S * 0.34,
          S * 0.42,
        );
        neb1.addColorStop(0, rgba(PINK, 0.18));
        neb1.addColorStop(0.55, rgba(PURPLE, 0.1));
        neb1.addColorStop(1, "transparent");
        ctx.fillStyle = neb1;
        ctx.fillRect(0, 0, S, S);

        const neb2 = ctx.createRadialGradient(
          S * 0.64,
          S * 0.42,
          0,
          S * 0.64,
          S * 0.42,
          S * 0.38,
        );
        neb2.addColorStop(0, rgba(PURPLE, 0.2));
        neb2.addColorStop(0.6, "rgba(90,40,200,0.07)");
        neb2.addColorStop(1, "transparent");
        ctx.fillStyle = neb2;
        ctx.fillRect(0, 0, S, S);

        // Stars (only in upper area for cleanliness)
        const rand = rng(42);
        for (let i = 0; i < 180; i++) {
          const x = rand() * S;
          const y = rand() * S * 0.78;
          const r = rand() * 2.0 + 0.35;
          const a = rand() * 0.55 + 0.2;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = rgba(WHITE, a);
          ctx.fill();
        }

        // -------- Boat geometry
        const mx = S * 0.5;
        const sailTop = S * 0.13;
        const sailBot = S * 0.64;

        // Warm “boat glow” (subtle)
        const boatGlow = ctx.createRadialGradient(
          S * 0.5,
          S * 0.52,
          0,
          S * 0.5,
          S * 0.52,
          S * 0.32,
        );
        boatGlow.addColorStop(0, rgba(AMBER, 0.12));
        boatGlow.addColorStop(1, "transparent");
        ctx.fillStyle = boatGlow;
        ctx.fillRect(0, 0, S, S);

        // Sails
        const mainGrad = ctx.createLinearGradient(
          mx,
          sailTop,
          mx + 320,
          sailBot,
        );
        mainGrad.addColorStop(0, "#FFD76E");
        mainGrad.addColorStop(0.4, AMBER);
        mainGrad.addColorStop(0.78, "#E86B5A");
        mainGrad.addColorStop(1, PINK);
        pathMainSail(ctx, mx, sailTop, sailBot, 320);
        ctx.fillStyle = mainGrad;
        ctx.fill();

        const jibGrad = ctx.createLinearGradient(
          mx,
          sailTop + 10,
          mx - 250,
          sailBot,
        );
        jibGrad.addColorStop(0, "#FFD76E");
        jibGrad.addColorStop(0.52, "#E8A040");
        jibGrad.addColorStop(1, "#D06080");
        pathJibSail(ctx, mx, sailTop, sailBot, 250);
        ctx.fillStyle = jibGrad;
        ctx.fill();

        // Mast (cleaner with a small highlight)
        ctx.lineCap = "round";
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#C8912E";
        ctx.beginPath();
        ctx.moveTo(mx, sailTop - 12);
        ctx.lineTo(mx, sailBot + 30);
        ctx.stroke();

        ctx.lineWidth = 2.5;
        ctx.strokeStyle = rgba("#FFD76E", 0.65);
        ctx.beginPath();
        ctx.moveTo(mx - 1.2, sailTop - 10);
        ctx.lineTo(mx - 1.2, sailBot + 28);
        ctx.stroke();

        // Hull (drawn BEFORE water so water can occlude it cleanly)
        const hullTopY = sailBot + 6;
        const hullW = S * 0.62;
        const hullH = 92;

        const hullGrad = ctx.createLinearGradient(
          S * 0.2,
          hullTopY,
          S * 0.8,
          hullTopY + hullH,
        );
        hullGrad.addColorStop(0, "#C07830");
        hullGrad.addColorStop(1, PURPLE);
        pathHull(ctx, S * 0.5, hullTopY, hullW, hullH);
        ctx.fillStyle = hullGrad;
        ctx.fill();

        // -------- Water system (THIS is the “clean” part)
        const waterlineY = S * 0.7;

        // (1) Base water fill clipped to surface
        ctx.save();
        pathWaterSurface(ctx, waterlineY, 0.65);
        ctx.clip();

        // Big water gradient fill
        const waterGrad = ctx.createLinearGradient(0, waterlineY - 40, 0, S);
        waterGrad.addColorStop(0, "rgba(30,35,90,0.72)");
        waterGrad.addColorStop(0.55, "rgba(40,80,140,0.62)");
        waterGrad.addColorStop(1, "rgba(20,45,90,0.80)");
        ctx.fillStyle = waterGrad;
        ctx.fillRect(0, waterlineY - 60, S, S - (waterlineY - 60));

        // (2) Two very soft wave layers (kept minimal)
        for (let i = 0; i < 2; i++) {
          const y = waterlineY + 24 + i * 44;
          const amp = 16 + i * 6;
          const ph = 0.9 + i * 1.2;
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x <= S; x += 6) {
            const t = x / S;
            ctx.lineTo(x, y + Math.sin(t * Math.PI * 3.0 + ph) * amp);
          }
          ctx.lineTo(S, S);
          ctx.lineTo(0, S);
          ctx.closePath();
          ctx.fillStyle = rgba(i === 0 ? PURPLE : TEAL, 0.18 - i * 0.05);
          ctx.fill();
        }

        // (3) Under-hull ambient occlusion (contact shadow)
        //     Use a soft elliptical gradient centered slightly below hull top.
        const ao = ctx.createRadialGradient(
          S * 0.5,
          waterlineY - 10,
          0,
          S * 0.5,
          waterlineY - 10,
          S * 0.3,
        );
        ao.addColorStop(0, "rgba(0,0,0,0.35)");
        ao.addColorStop(0.55, "rgba(0,0,0,0.10)");
        ao.addColorStop(1, "transparent");
        ctx.fillStyle = ao;
        ctx.fillRect(0, waterlineY - 120, S, 260);

        // (4) Wake highlight following hull curve
        //     This sells the “hull sitting in water” effect.
        ctx.globalCompositeOperation = "screen";
        ctx.strokeStyle = rgba("#FFD76E", 0.22);
        ctx.lineWidth = 6;
        ctx.beginPath();
        const left = S * 0.5 - hullW * 0.5;
        const right = S * 0.5 + hullW * 0.5;
        const midY = waterlineY - 4;
        ctx.moveTo(left + 40, midY + 10);
        ctx.quadraticCurveTo(S * 0.5, midY - 18, right - 44, midY + 12);
        ctx.stroke();

        ctx.strokeStyle = rgba(WHITE, 0.1);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(left + 60, midY + 22);
        ctx.quadraticCurveTo(S * 0.5, midY - 6, right - 62, midY + 22);
        ctx.stroke();

        ctx.globalCompositeOperation = "source-over";
        ctx.restore(); // end water clip

        // (5) Waterline “front lip” — a thin dark edge to enhance occlusion
        ctx.strokeStyle = "rgba(0,0,0,0.28)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        // redraw only the top waterline (no fill)
        const A1 = 14,
          A2 = 7,
          A3 = 4;
        ctx.moveTo(0, waterlineY);
        for (let x = 0; x <= S; x += 6) {
          const t = x / S;
          const y =
            waterlineY +
            Math.sin(t * Math.PI * 2.1 + 0.65) * A1 +
            Math.sin(t * Math.PI * 3.9 + 0.65 * 1.6) * A2 +
            Math.sin(t * Math.PI * 8.2 + 0.65 * 0.9) * A3;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Bottom fade (keeps the icon polished)
        const bot = ctx.createLinearGradient(0, S * 0.82, 0, S);
        bot.addColorStop(0, "transparent");
        bot.addColorStop(1, "rgba(0,0,0,0.35)");
        ctx.fillStyle = bot;
        ctx.fillRect(0, S * 0.82, S, S * 0.18);
      }

      const c = document.getElementById("c");
      const ctx = c.getContext("2d");
      drawCosmicClean(ctx);
    </script>
  </body>
</html>
